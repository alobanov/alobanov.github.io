<!-- script for full-size image -->
<script src="{{ "/assets/js/image_pop.js" | relative_url }}"></script>

<p class="log-cats">
    <span class="tag small"><a href="{{ site.baseurl }}/logs/">{% include log_icon.html category="all" %} All</a></span>
    {%- assign categories = site.logs | map: "category" | uniq | sort -%}
    {% for category in categories %}
    <span class="tag small cat-tag--{{ category }}"><a href="{{ site.baseurl }}/logs/{{ category }}">{% include log_icon.html category=category %} {{ category | capitalize }}</a></span>
    {% endfor %}
</p>

<!-- Modal for full-size image -->
<div id="image-modal" class="modal" onclick="closeModal(event)">
    <span class="close" onclick="closeModal(event)">&times;</span>
    <img class="modal-content" id="modal-img">
</div>
