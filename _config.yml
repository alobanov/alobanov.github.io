url: "https://lobanov-av.ru"

# Имя сайта, а не имя автора: title уходит в заголовок вкладки, в og:site_name
# и в заголовок фида — везде, где сайт представляется сам. Пишется так же, как
# заголовок на главной, чтобы вкладка и страница называли одно и то же.
# В кавычках намеренно: тильда в начале скаляра — зарезервированный в YAML
# символ null, и полагаться на то, что разбор всё равно даст строку, незачем.
title: "~stdout"
author: Aleksei
description: Logs, music and notes — films, games and podcasts with short notes, tracks made without a DAW, and bookmarks worth keeping.
google_analytics:
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM

collections:
  bookmarks:
    output: true
  logs:
    output: true
  # Релизы месяца выводятся только на /music/: текст в пару предложений целиком
  # помещается на общей странице, а отдельные страницы засорили бы фид и sitemap.
  music:
    output: false

plugins:
  - jemoji

# Nothing here belongs on the public site. Note that setting `exclude` replaces
# Jekyll's defaults rather than adding to them, so the Gemfile entries have to
# be repeated.
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor/
  - node_modules/
  - AGENTS.override.md      # internal working notes
  - docs/                   # design specs
  - script/                 # one-off migration scripts
  - jekyll-theme-minimal.gemspec
  - LICENSE
  - .tool-versions
  - 2024-05-10-test.md      # leftover scratch page
